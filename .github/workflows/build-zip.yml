name: Build Infinity Client

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."
          find project -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: |
          ROOT=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          echo "Building from: $ROOT"
          cd "$ROOT"
          gradle build --no-daemon

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-Client
          path: project/**/build/libs/*.jar
